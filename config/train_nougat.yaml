# 使用前请将 /path/to/workspace 替换为本机路径，或通过命令行覆盖，例如：
#   python train.py --config config/train_nougat.yaml result_path=/your/result model_path=/your/model ...
resume_from_checkpoint_path: null
result_path: "/path/to/workspace/model_out/"
model_path: "/path/to/workspace/model/nougat-base"
pretrained_weight_path: "/path/to/workspace/model/nougat-base/aligned_model_weights.pth"
train_dataset_paths: ["./train.jsonl"]
val_dataset_paths: ["./validation.jsonl"]
tokenizer: "/path/to/workspace/model/nougat-base/tokenizer.json"
exp_name: "nougat_finetune"
exp_version: "v1"
train_batch_sizes: [2]
num_workers: 8
val_batch_sizes: [2]
val_batches: 1
input_size: [896, 672]
# input_size: [384, 384]
max_length: 4096
max_position_embeddings: 4096
accumulate_grad_batches: 4
window_size: 7
# window_size: 12
patch_size: 4
embed_dim: 128
hidden_dimension: 1024
num_heads: [4, 8, 16, 32]
encoder_layer: [2, 2, 14, 2]
decoder_layer: 10
align_long_axis: False
num_nodes: 1
seed: 25
lr: 5e-5
min_lr: 7.5e-6
lr_step: 16
gamma: 0.9996
warmup_steps: 250
num_training_samples_per_epoch: 10
max_epochs: 30
max_steps: -1
val_check_interval: 800
check_val_every_n_epoch: 1
gradient_clip_val: 0.5
verbose: False
debug: True
